name: Pro System Core Validation

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prosystem-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate repository
        run: python3 tools/validate_templates.py .
      - name: Validate production composition
        run: python3 tools/validate_templates.py . --select core-standard security-baseline registry-dependencies validator-tests production-agent
